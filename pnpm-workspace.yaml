nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  "@anthropic-ai/sdk": 0.109.1
  "@opentelemetry/core": 2.8.0
  "@opentelemetry/propagator-jaeger": 2.10.0
  "@aws-sdk/core": 3.974.27
  "@aws-sdk/credential-provider-node": 3.972.61
  "@aws-sdk/xml-builder": 3.972.33
  hono: 4.12.25
  "@hono/node-server": 1.19.14
  # GHSA-c29m-xwm3-cm6r / GHSA-mghh-pgcx-3jjj / GHSA-x97p-jq2g-jp4f /
  # GHSA-3pq3-5fj3-cg6v / GHSA-542g-h47m-68v8: axios <1.20.0 — ReDoS in the
  # data: URL parser and proxy-bypass host normalization, prototype pollution
  # via toFormData, and two HTTP/2-adapter DoS/bypass issues.
  axios: 1.20.0
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf /
  # GHSA-jqff-g426-hqxp: fast-uri <4.1.3 has host-confusion/SSRF bugs in IDN,
  # IPv6, and percent-decoding normalization. Fixed at 4.1.3.
  # GHSA-qw65-cvwx-89v3 / GHSA-58mr-gqgx-xq4g: fast-uri <4.1.4 has an
  # authority-injection bug via unvalidated port and host-confusion via an
  # unclosed bracket in serialize(). Fixed at 4.1.4.
  fast-uri: 4.1.4
  # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c: follow-redirects <1.16.1 allows
  # array-form headers to bypass cross-origin credential stripping and has a
  # sensitiveHeaders regex that can expose credential headers. Fixed at 1.16.1.
  follow-redirects: 1.16.1
  defu: 6.1.5
  fast-xml-parser: 5.7.0
  request: "npm:@cypress/request@3.0.10"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  basic-ftp: 6.0.1
  file-type: 22.0.1
  form-data: 2.5.6
  ip-address: 10.7.0
  minimatch: 10.2.5
  "nanoid@<3.3.18": 3.3.18
  "postcss@<=8.5.17": 8.5.26
  path-to-regexp: 8.4.0
  qs: 6.15.2
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: 1.3.3
  tar: 7.5.22
  tough-cookie: 4.1.3
  yauzl: 3.2.1
  protobufjs: 7.6.5
  uuid: 14.0.0
  # Security-audit bumps (security-fast / pnpm-audit-prod): force transitive
  # deps off versions with high/critical advisories. Conservative in-range
  # targets where possible (no major bumps). See PR for advisory list.
  "@grpc/grpc-js": 1.14.4
  # GHSA-22p9-wv53-3rq4: linkify-it <5.0.2 quadratic-complexity ReDoS in
  # LinkifyIt#match. markdown-it@15 requires linkify-it ^6.0.0; 6.1.0 carries
  # no known advisories, so the pin moves up with it instead of conflicting.
  linkify-it: 6.1.0
  # GHSA-mh99-v99m-4gvg: brace-expansion <=5.0.7 DoS via unbounded expansion.
  # GHSA-rgw5-rvv9-x895: brace-expansion <5.0.9 DoS via unbounded intermediate arrays.
  # GHSA-qhr7-859c-m2p7: brace-expansion <5.0.11 DoS via uncontrolled recursion
  # on nested brace groups. GHSA-6j4f-fj2g-mc7p: brace-expansion <5.0.10 DoS
  # via uncontrolled recursion in parseCommaParts.
  brace-expansion: 5.0.11
  # GHSA-r28c-9q8g-f849: postcss <=8.5.17 path traversal in source-map auto-load.
  postcss: 8.5.22
  # GHSA-jqcg-44mw-7w3h: proxy-addr <2.0.8 IP spoofing via IPv4-mapped IPv6 trust subnet.
  proxy-addr: 2.0.8
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS via indexed
  # source-map section offsets.
  source-map-js: 1.2.2
  # GHSA-v5rq-49vh-5v5c: simple-git <2.0.1 argv-parser omits the VISUAL
  # editor env var from unsafe-editor detection, allowing command execution.
  "@simple-git/argv-parser": 2.0.1
  # GHSA-v5rq-49vh-5v5c / GHSA-x6jw-m9v5-85vh / GHSA-g4wm-2vf7-vfgr /
  # GHSA-858h-whjf-mvg5: simple-git <4.0.1 has multiple unsafe-operations
  # guard bypasses (VISUAL env var, trailer config, Git config includes,
  # --receive-p/--exe long-option abbreviation) allowing command execution.
  # Major bump: node-llama-cpp (the only consumer, via the optional
  # llama-cpp-provider extension) declares simple-git ^3.33.0, but only
  # imports the long-stable `simpleGit()` factory + `.clone()`/
  # `.removeRemote()` -- none of the surface removed in 4.x (the deprecated
  # `simple-git/promise` subpath). Verified via extensions/llama-cpp's own
  # test suite and a direct runtime import smoke test.
  simple-git: 4.0.2
  # Scope the undici security pin per major line. jsdom needs `undici@^7.25.0`
  # and imports lib/handler/wrap-handler.js, removed in 8.x, while the 6.11
  # extensions depend on undici 8.5.0 directly — a single flat override would
  # force one line onto an incompatible major. Keep both lines patched
  # independently instead (GHSA-4cwx-7wf7-3272, undici cross-user cache
  # disclosure/crash, fixed at 7.29.0 and 8.9.0 respectively;
  # GHSA-rfgv-xxqx-mfg5 unrequested-WebSocket-subprotocol DoS and
  # GHSA-w293-vg96-wgc3 BalancedPool TLS cert-validation bypass, fixed at
  # 7.29.1 and 8.10.2 respectively).
  "undici@7": 7.29.1
  "undici@8": 8.10.2
  # GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv (nanoid non-secure generator
  # loop). Range-scoped like undici above (not a "parent>child" path selector
  # — that syntax is pnpm-only and crashes generate-npm-shrinkwrap.mjs's `npm
  # install --package-lock-only` step with EINVALIDTAGNAME, since npm's
  # overrides field has no path-selector syntax). "pkg@range" IS valid in
  # both pnpm and npm, and keeps the two nanoid majors independent: postcss's
  # toolchain needs nanoid's CJS-era ^3 API while node-llama-cpp resolves the
  # ESM-only 5.x line — a single global override would force one chain onto
  # an incompatible major. 3.3.17 turned out to still be vulnerable
  # (GHSA-2v37-7h3g-55p8's fixed range is >=3.3.18); 3.3.18 is the real fix.
  "nanoid@3": 3.3.18
  "nanoid@5": 5.1.16
  # GHSA-587h-7wmj-h5pm: vite's bundled launch-editor <=8.1.5 has an
  # fs.existsSync() check that can be bypassed on Windows. Fixed at 8.1.6.
  vite: 8.1.6
  # GHSA-gfr2-rv44-r23c: markdown-it quadratic-time rendering of multi-line
  # link reference definitions has independent vulnerable ranges per major
  # line (>=14.1.0,<14.3.3 and >=15.0.0,<15.0.3); GHSA-r7fv-28h4-cvq7's
  # smartquotes quadratic complexity is fixed by <14.3.2 / >=15.0.0,<15.0.2.
  # Direct deps moved to the 15.x line (markdown-it@15 needs linkify-it ^6,
  # see linkify-it below); force transitive resolutions to the same safe
  # version so nothing pulls in an older vulnerable copy.
  markdown-it: 15.0.3
  ws: 8.21.0
  "@vitest/browser": 4.1.11

allowBuilds:
  "@openclaw/fs-safe": true
  "@google/genai": true
  "@lydell/node-pty": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@tloncorp/api": true
  "@tloncorp/tlon-skill": true
  baileys: true
  authenticate-pam: true
  "@discordjs/opus": false
  esbuild: true
  koffi: false
  node-llama-cpp: false
  protobufjs: true
  tree-sitter-bash: false
  openclaw: true
  "@openclaw/proxyline": true
  clawpdf: true
  "@openclaw/crabline": true
  rastermill: true

packageExtensions:
  baileys:
    peerDependenciesMeta:
      sharp:
        optional: true

patchedDependencies:
