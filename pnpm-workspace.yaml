packages:
  - .
  - ui
  - packages/*
  - extensions/*

# 5 days, the same supply-chain wait as the Dependabot cooldown in
# .github/dependabot.yml (ENG-22470): hijacked npm releases (chalk/debug,
# Shai-Hulud, 2025) were usually pulled within that window.
minimumReleaseAge: 7200

minimumReleaseAgeExclude:
  # GHSA-vp8m-p9jh-q5pm / GHSA-w293-vg96-wgc3 security fix; remove after 2026-09-12.
  - "undici@8.10.2"
  - "undici@7.29.1"
  - "@openclaw/crabline@0.1.6"
  - "@openclaw/proxyline@0.3.3"
  - "acpx"
  - "tokenjuice"
  - "@agentclientprotocol/claude-agent-acp@0.39.0"
  - "@agentclientprotocol/sdk"
  - "axios"
  - "basic-ftp"
  - "baileys@7.0.0-rc13"
  - "hono"
  - "libopus-wasm@0.2.0"
  - "libsignal@6.0.0"
  - "nanoid@3.3.18"
  - "openclaw"
  - "protobufjs"
  - "vite"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@aws-sdk/client-bedrock-runtime@3.1053.0"
  - "@aws-sdk/client-bedrock@3.1053.0"
  - "@aws-sdk/client-cognito-identity@3.1053.0"
  - "@aws-sdk/client-s3@3.1053.0"
  - "@aws-sdk/core"
  - "@aws-sdk/credential-providers@3.1053.0"
  - "@aws-sdk/s3-request-presigner@3.1053.0"
  - "@aws-sdk/token-providers@3.1052.0"
  - "@aws-sdk/token-providers@3.1053.0"
  - "@copilotkit/aimock@1.27.1"
  - "@earendil-works/pi-tui"
  - "@google/genai@2.6.0"
  - "@larksuiteoapi/node-sdk@1.66.0"
  - "@microsoft/teams.api@2.0.12"
  - "@microsoft/teams.apps@2.0.12"
  - "@microsoft/teams.cards@2.0.12"
  - "@microsoft/teams.common@2.0.12"
  - "@microsoft/teams.graph@2.0.12"
  - "@openai/codex"
  - "@openai/codex-*"
  - "@pierre/diffs@1.2.3"
  - "@smithy/shared-ini-file-loader@4.5.4"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxc-project/types"
  - "oxfmt"
  - "axios@1.15.0"
  - "discord-api-types"
  - "esbuild@0.28.1"
  - "@esbuild/aix-ppc64@0.28.1"
  - "@esbuild/android-arm@0.28.1"
  - "@esbuild/android-arm64@0.28.1"
  - "@esbuild/android-x64@0.28.1"
  - "@esbuild/darwin-arm64@0.28.1"
  - "@esbuild/darwin-x64@0.28.1"
  - "@esbuild/freebsd-arm64@0.28.1"
  - "@esbuild/freebsd-x64@0.28.1"
  - "@esbuild/linux-arm@0.28.1"
  - "@esbuild/linux-arm64@0.28.1"
  - "@esbuild/linux-ia32@0.28.1"
  - "@esbuild/linux-loong64@0.28.1"
  - "@esbuild/linux-mips64el@0.28.1"
  - "@esbuild/linux-ppc64@0.28.1"
  - "@esbuild/linux-riscv64@0.28.1"
  - "@esbuild/linux-s390x@0.28.1"
  - "@esbuild/linux-x64@0.28.1"
  - "@esbuild/netbsd-arm64@0.28.1"
  - "@esbuild/netbsd-x64@0.28.1"
  - "@esbuild/openbsd-arm64@0.28.1"
  - "@esbuild/openbsd-x64@0.28.1"
  - "@esbuild/openharmony-arm64@0.28.1"
  - "@esbuild/sunos-x64@0.28.1"
  - "@esbuild/win32-arm64@0.28.1"
  - "@esbuild/win32-ia32@0.28.1"
  - "@esbuild/win32-x64@0.28.1"
