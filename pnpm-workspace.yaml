nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  "@anthropic-ai/sdk": 0.100.1
  "@opentelemetry/core": 2.9.0
  "@aws-sdk/core": 3.974.13
  "@aws-sdk/credential-provider-node": 3.972.52
  "@aws-sdk/xml-builder": 3.972.25
  # GHSA-5r4p-p66f-jhc7 / GHSA-hxh3-vqpv-xpqv / GHSA-gqvv-2mrq-wpjv /
  # GHSA-g6gw-c38x-mqfc / GHSA-crvj-82cr-hjcx / GHSA-8j4g-w8fx-2239 and
  # earlier: hono <4.13.11 (serveStatic double-decode, JSX XSS, toSSG path
  # escape, parseBody/query-parser/CORS DoS + differentials). Fixed at 4.13.11.
  hono: 4.13.14
  # GHSA-rmxm-3fg6-px4f: @hono/node-server <2.1.3 serveStatic double-decode
  # middleware bypass; no 1.x fix exists. Major bump: the only consumer,
  # @modelcontextprotocol/sdk, declares "^1.19.9 || ^2.0.5" and only imports
  # getRequestListener, so 2.x is inside its declared range.
  "@hono/node-server": 2.1.5
  # GHSA-c29m-xwm3-cm6r / GHSA-mghh-pgcx-3jjj / GHSA-x97p-jq2g-jp4f /
  # GHSA-3pq3-5fj3-cg6v / GHSA-542g-h47m-68v8: axios <1.20.0 — ReDoS in the
  # data: URL parser and proxy-bypass host normalization, prototype pollution
  # via toFormData, and two HTTP/2-adapter DoS/bypass issues.
  axios: 1.20.0
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf /
  # GHSA-jqff-g426-hqxp: fast-uri <4.1.3 has host-confusion/SSRF bugs in IDN,
  # IPv6, and percent-decoding normalization. Fixed at 4.1.3.
  # GHSA-qw65-cvwx-89v3 / GHSA-58mr-gqgx-xq4g: fast-uri <4.1.4 has an
  # authority-injection bug via unvalidated port and host-confusion via an
  # unclosed bracket in serialize(). Fixed at 4.1.4.
  # GHSA-hrr3-gc8f-f4qj / GHSA-jvvf-x445-j334 (fixed 4.1.5) and
  # GHSA-w74x-v6f9-j3xg / GHSA-xhq7-xmqj-769h / GHSA-wjr9-j795-jxcr /
  # GHSA-333x-w4r6-6crp (fixed 4.2.3): host-case, mailto header, scheme
  # spoofing/injection, and path-equivalence normalization bugs.
  fast-uri: 4.2.3
  # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c / GHSA-mrwp-f3q8-3g9p:
  # follow-redirects <=1.16.1 can send credential headers across origins on
  # redirect (array-form headers, sensitiveHeaders regex escaping, cross-realm
  # sensitiveHeaders arrays). Fixed at 1.16.2.
  follow-redirects: 1.16.2
  defu: 6.1.5
  fast-xml-parser: 5.7.0
  file-type: 22.0.1
  form-data: 2.5.6
  # CVE-2026-111997: ip-address <10.7.4 (Medium, Amazon Inspector on the
  # boon-agent-signup-container image). Fixed at 10.7.4.
  ip-address: 10.7.5
  # CVE-2026-118764: minimatch <11.0.1 CPU/memory blowup on `**/..` patterns, and
  # CVE-2026-118773: glob <14.0.2 (Medium, Amazon Inspector on the paid fleet and
  # the boon-agent-signup-container image). Fixed at 11.0.1 / 14.0.2.
  glob: 14.0.3
  minimatch: 11.0.3
  path-to-regexp: 8.4.0
  # CVE-2026-82417: qs <6.16.0 (High, Amazon Inspector on the
  # boon-agent-signup-container image, ENG-21880). Fixed at 6.16.0.
  qs: 6.16.1
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: 1.1.39
  tar: 7.5.22
  tough-cookie: 4.1.3
  protobufjs: 7.6.5
  uuid: 14.0.0
  # Security-audit bumps (security-fast / pnpm-audit-prod): force transitive
  # deps off versions with high/critical advisories. Conservative in-range
  # targets where possible (no major bumps). See PR for advisory list.
  linkify-it: 5.0.2
  # GHSA-mh99-v99m-4gvg: brace-expansion <=5.0.7 DoS via unbounded expansion.
  # GHSA-rgw5-rvv9-x895: brace-expansion <5.0.9 DoS via unbounded intermediate arrays.
  # GHSA-qhr7-859c-m2p7: brace-expansion <5.0.11 DoS via uncontrolled recursion
  # on nested brace groups. GHSA-6j4f-fj2g-mc7p: brace-expansion <5.0.10 DoS
  # via uncontrolled recursion in parseCommaParts. GHSA-q2hr-2g5m-vwhr:
  # brace-expansion <5.0.12 quadratic-time `{a},b}` rewrite DoS. 5.0.12 is
  # also the floor minimatch 11 requires.
  brace-expansion: 5.0.12
  # GHSA-r28c-9q8g-f849: postcss <=8.5.17 path traversal in source-map auto-load.
  # GHSA-fxqj-rqcc-2cmp: postcss <=8.5.22 reads arbitrary .map files via
  # sourceMappingURL when `from` is unset. Fixed at 8.5.23.
  postcss: 8.5.32
  # GHSA-jqcg-44mw-7w3h: proxy-addr <2.0.8 IP spoofing via IPv4-mapped IPv6 trust subnet.
  proxy-addr: 2.0.8
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS via indexed
  # source-map section offsets.
  source-map-js: 1.2.2
  # GHSA-v5rq-49vh-5v5c: simple-git <2.0.1 argv-parser omits the VISUAL
  # editor env var from unsafe-editor detection, allowing command execution.
  "@simple-git/argv-parser": 2.0.1
  # GHSA-v5rq-49vh-5v5c / GHSA-x6jw-m9v5-85vh / GHSA-g4wm-2vf7-vfgr /
  # GHSA-858h-whjf-mvg5: simple-git <4.0.1 has multiple unsafe-operations
  # guard bypasses (VISUAL env var, trailer config, Git config includes,
  # --receive-p/--exe long-option abbreviation) allowing command execution.
  # Major bump: node-llama-cpp (the only consumer, via the optional
  # llama-cpp-provider extension) declares simple-git ^3.33.0, but only
  # imports the long-stable `simpleGit()` factory + `.clone()`/
  # `.removeRemote()` -- none of the surface removed in 4.x (the deprecated
  # `simple-git/promise` subpath). Verified via extensions/llama-cpp's own
  # test suite and a direct runtime import smoke test.
  simple-git: 4.0.2
  # Scope the undici security pin per major line. jsdom needs `undici@^7.25.0`
  # and imports lib/handler/wrap-handler.js, removed in 8.x, while the 6.11
  # extensions depend on undici 8.5.0 directly — a single flat override would
  # force one line onto an incompatible major. Keep both lines patched
  # independently instead (GHSA-4cwx-7wf7-3272, undici cross-user cache
  # disclosure/crash, fixed at 7.29.0 and 8.9.0 respectively;
  # GHSA-rfgv-xxqx-mfg5 unrequested-WebSocket-subprotocol DoS and
  # GHSA-w293-vg96-wgc3 BalancedPool TLS cert-validation bypass, fixed at
  # 7.29.1 and 8.10.2 respectively;
  # GHSA-xjj6-f33q-929c unhandled-error DoS on excessive content-encodings,
  # fixed at 7.30.1 and 8.12.2 respectively).
  "undici@7": 7.30.1
  "undici@8": 8.12.3
  # GHSA-27r3-jxmh-p828: body-parser <2.4.0 DoS via trailing bytes after a
  # compressed request body. Transitive via express@5.2.1 (declares
  # ^2.2.1, which already allows 2.4.0) — force it directly since express
  # itself hasn't bumped its declared range yet.
  body-parser: 2.4.0
  # GHSA-mrhx-c7xc-m3w5: zod <4.6.6 can exhaust memory validating oversized
  # constrained collections. Direct deps already pin 4.6.7, but several
  # transitive consumers (@agentclientprotocol/claude-agent-acp,
  # @agentclientprotocol/sdk, @github/copilot-sdk, @mistralai/mistralai,
  # @openclaw/crabline) declare their own zod@4.x range that still resolves
  # to the vulnerable 4.4.3. Scoped to the "4" line only — zod@3.25.76
  # (a2ui/web_core's own dependency, unaffected by this range) is untouched.
  # Dependabot alert #285 stays open on purpose (ENG-22470): the advisory's
  # range is <4.6.6, so every 3.x is "vulnerable", there is no patched 3.x,
  # and every @a2ui/web_core release (0.10.x-0.15.x) still declares
  # zod ^3.25.76. Forcing zod 4 onto a2ui would break it. Revisit when a2ui
  # moves to zod 4.
  "zod@4": 4.6.7
  # GHSA-xcx6-jx8p-x3h5: @azure/msal-node authorization-code flow may
  # disclose parameters to an attacker-controlled endpoint, affecting the
  # whole >=5.0.0-beta.0 <7.1.0 range (all of 5.x and 6.x). Transitive via
  # @azure/identity@4.13.1 (declares ^5.1.0) for the msteams extension's
  # ClientCertificateCredential auth path. Scoped to the "5" line only:
  # @microsoft/teams.apps's own msal-node@^3.8.1 dependency isn't in the
  # vulnerable range and is left alone. @azure/identity's own latest
  # (4.14.0) only tracks msal-node ^6.0.0, which is itself still inside
  # the vulnerable range, so there's no in-contract fix short of 7.1.0 —
  # needs live Teams certificate-auth verification before release.
  "@azure/msal-node@5": 7.1.1
  # GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv (nanoid non-secure generator
  # loop). Range-scoped like undici above (not a "parent>child" path selector
  # — that syntax is pnpm-only and crashes generate-npm-shrinkwrap.mjs's `npm
  # install --package-lock-only` step with EINVALIDTAGNAME, since npm's
  # overrides field has no path-selector syntax). "pkg@range" IS valid in
  # both pnpm and npm, and keeps the two nanoid majors independent: postcss's
  # toolchain needs nanoid's CJS-era ^3 API while node-llama-cpp resolves the
  # ESM-only 5.x line — a single global override would force one chain onto
  # an incompatible major. 3.3.17 turned out to still be vulnerable
  # (GHSA-2v37-7h3g-55p8's fixed range is >=3.3.18); 3.3.18 is the real fix.
  "nanoid@3": 3.3.18
  "nanoid@5": 5.1.16
  # GHSA-587h-7wmj-h5pm: vite's bundled launch-editor <=8.1.5 has an
  # fs.existsSync() check that can be bypassed on Windows. Fixed at 8.1.6.
  vite: 8.1.6
  # GHSA-gfr2-rv44-r23c / GHSA-r7fv-28h4-cvq7: markdown-it has quadratic-time
  # rendering of multi-line link reference definitions (regression since
  # 14.1.0) and quadratic complexity in smartquotes with unmatched closing
  # quotes. Both fixed at 14.3.3; staying on the 14.x line (no major bump).
  markdown-it: 14.3.3
  ws: 8.21.0
  # GHSA-qxg6-89mg-rqv8 / GHSA-xp26-3454-mjgp: @vitest/mocker <4.1.12 manual
  # mock code injection and Windows redirect-allowlist bypass. Keep every
  # vitest/@vitest/* package on the same 4.1.x patch.
  "@vitest/browser": 4.1.12
  # GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr: tinypool <2.1.2 prototype
  # pollution gadget to RCE via worker/run() options. Dev-only, via
  # oxfmt@0.52.0, which pins tinypool to exactly 2.1.0 (oxfmt's latest pins
  # 2.2.0). Drop this override when oxfmt is bumped past that.
  tinypool: 2.2.0

allowBuilds:
  "@openclaw/fs-safe": true
  "@google/genai": true
  "@lydell/node-pty": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@tloncorp/api": true
  "@tloncorp/tlon-skill": true
  baileys: true
  authenticate-pam: true
  "@discordjs/opus": false
  esbuild: true
  koffi: false
  node-llama-cpp: false
  protobufjs: true
  tree-sitter-bash: false
  openclaw: true
  "@openclaw/proxyline": true
  clawpdf: true
  "@openclaw/crabline": true
  rastermill: true

packageExtensions:
  baileys:
    peerDependenciesMeta:
      sharp:
        optional: true

patchedDependencies:
  "@agentclientprotocol/claude-agent-acp@0.39.0": patches/@agentclientprotocol__claude-agent-acp@0.39.0.patch
