name: Boon Fork Release

# Builds and publishes the getboon/openclaw fork release artifact on a
# `v<version>-boon.N` tag. The fork is NOT published to npm; the fleet
# (gandalf-manager) installs the GitHub Release tarball directly via
# `npm i -g <tarball-url>` (see packer/scripts/03-install-openclaw.sh and the
# fleet-sweep upgrade plugin). This workflow removes the manual step of building
# and uploading that tarball + its sha256 by hand.
#
# Output contract consumed by every fleet pin — do NOT change the shape:
#   https://github.com/getboon/openclaw/releases/download/v<version>/openclaw-<version>.tgz
#   plus a sibling openclaw-<version>.tgz.sha256 (single `<sha>  <file>` line).
#
# It ALSO publishes the fork-versioned @openclaw/msteams channel plugin as a
# sibling asset on the SAME tag. Upstream ships @openclaw/msteams via
# the public npm registry, but the fork's `-boon.N` version cannot publish there
# (the npm-publish version validator has no `-boon.N` arm, and `@openclaw/*` is an
# upstream-owned scope). So — exactly like the gateway above — the fork ships
# msteams as a GitHub Release tarball, and gandalf-manager installs it via
# `npm i -g <asset-url>`. This retires the host-local SP-PATCH / dist-swap that
# shipped the fork's msteams fixes (attachment + topLevel +
# filecard→SharePoint-link) as fragile per-host edits. msteams asset contract —
# also do NOT change the shape:
#   https://github.com/getboon/openclaw/releases/download/v<version>/openclaw-msteams-<version>.tgz
#   plus a sibling openclaw-msteams-<version>.tgz.sha256.
# extensions/msteams/package.json version is pinned to the gateway version in
# lockstep (`2026.6.11-boon.N`), so this tag's msteams asset always matches core.
#
# It ALSO publishes the fork-versioned @openclaw/slack channel plugin as a sibling
# asset on the SAME tag, for the same reason as msteams: upstream ships
# @openclaw/slack on public npm, but the fleet needs the fork's invalid_thread_ts
# thread-anchor recovery fix, which lives only in the fork's extensions/slack and is
# NOT bundled into the gateway tarball. slack asset contract — do NOT change:
#   https://github.com/getboon/openclaw/releases/download/v<version>/openclaw-slack-<version>.tgz
#   plus a sibling openclaw-slack-<version>.tgz.sha256.
# extensions/slack/package.json is pinned to the gateway version in lockstep too.
#
# It ALSO publishes the fork-versioned @openclaw/diagnostics-prometheus plugin as a
# sibling asset on the SAME tag. Its dist is EXCLUDED from the published gateway
# package (`!dist/extensions/diagnostics-prometheus/**`), so a host can't run the
# Prometheus exporter unless the plugin is installed separately — and the fleet's
# Alloy scrape (gandalf-manager, ENG-15788) has nothing to read until it is.
# diagnostics-prometheus asset contract — do NOT change:
#   https://github.com/getboon/openclaw/releases/download/v<version>/openclaw-diagnostics-prometheus-<version>.tgz
#   plus a sibling openclaw-diagnostics-prometheus-<version>.tgz.sha256.
# extensions/diagnostics-prometheus/package.json is pinned to the gateway version
# in lockstep too.
#
# Docker images are handled separately by docker-release.yml (also `v*`-tagged);
# its `-boon.N` suffix correctly never advances the mutable `:latest` aliases.
on:
  push:
    tags:
      - "v*-boon.*"

concurrency:
  group: boon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release + upload assets
    steps:
      - name: Checkout tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      # No explicit build step: `npm pack` runs prepack
      # (scripts/openclaw-prepack.ts), whose main() already runs `pnpm build` +
      # `pnpm ui:build` + artifact verification before packing. A separate build
      # here would just be discarded and rebuilt during pack, doubling CI time.
      - name: Pack tarball + compute sha256
        id: pack
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="openclaw-${version}.tgz"
          # `npm pack` runs prepack, whose build prints to stdout — so pack's
          # stdout is NOT just the filename and must not be parsed. Assert the
          # expected artifact exists on disk after packing instead (npm always
          # writes openclaw-<version>.tgz to cwd). This is the exact filename the
          # fleet pins against.
          npm pack
          if [[ ! -f "${tarball}" ]]; then
            echo "FATAL: expected '${tarball}' on disk after npm pack; found:" >&2
            ls -1 ./*.tgz >&2 || true
            exit 1
          fi
          sha256sum "${tarball}" > "${tarball}.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}"
          cat "${tarball}.sha256"

      # Guard: the tag must match package.json's version, so the published asset
      # URL (derived from the tag) resolves to the artifact it claims to be.
      - name: Assert tag matches package version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "FATAL: tag '${TAG}' does not match package.json version 'v${VERSION}'" >&2
            exit 1
          fi

      # Pack the fork-versioned @openclaw/msteams plugin. A plain
      # `npm pack` in extensions/msteams would ship raw TS + unresolved
      # `workspace:*` deps — NOT runnable. The publishable, runnable tarball is
      # produced by the fork's own plugin-release tooling: first build the
      # package-local `dist/`, then pack under the manifest overlay
      # (plugin-npm-package-manifest.mjs --run) which rewrites entries to
      # `./dist/*.js` and bundles workspace deps, then restores package.json.
      # This is the SAME machinery plugin-npm-release.yml uses; we only redirect
      # the artifact to a GitHub Release instead of npm.
      - name: Pack msteams plugin tarball + compute sha256
        id: msteams
        env:
          # Pass the tag via env (not inline ${{ }}) so it isn't interpolated into
          # the shell body — zizmor template-injection safety, matching the gateway
          # steps above.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./extensions/msteams/package.json').version")"
          # Guard: the msteams version MUST equal the gateway tag, so the asset
          # URL (derived from the tag) resolves to the artifact it claims to be
          # AND the compat gate (>=2026.6.11, satisfied by -boon.N normalization)
          # lines up with the core the fleet runs. A drifted msteams version fails
          # the release rather than shipping a mismatched plugin.
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "FATAL: tag '${TAG}' does not match extensions/msteams/package.json version 'v${version}' — bump msteams in lockstep with the gateway" >&2
            exit 1
          fi
          tarball="openclaw-msteams-${version}.tgz"
          # Build dist/ then pack via the overlay into cwd (a scoped package packs
          # to <scope-stripped>-<ver>.tgz → openclaw-msteams-<ver>.tgz).
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/msteams
          OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
            node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/msteams -- \
            npm pack --pack-destination "${GITHUB_WORKSPACE}"
          # Assert on disk — do NOT parse pack stdout (build noise, same reason as
          # the gateway pack step above).
          if [[ ! -f "${tarball}" ]]; then
            echo "FATAL: expected '${tarball}' on disk after msteams pack; found:" >&2
            ls -1 ./openclaw-msteams-*.tgz >&2 || true
            exit 1
          fi
          sha256sum "${tarball}" > "${tarball}.sha256"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}"
          cat "${tarball}.sha256"

      # Pack the fork-versioned @openclaw/slack plugin. Identical
      # machinery to the msteams step above: a plain `npm pack` in extensions/slack
      # would ship raw TS + unresolved `workspace:*` deps — NOT runnable. Build the
      # package-local dist/ then pack under the manifest overlay
      # (plugin-npm-package-manifest.mjs --run) which rewrites entries to
      # `./dist/*.js` and bundles workspace deps. WHY the fork must publish slack at
      # all: upstream ships @openclaw/slack on public npm, but the fleet needs the
      # fork's invalid_thread_ts thread-anchor recovery fix, which lives
      # only in the fork's extensions/slack — and the gateway tarball does NOT bundle
      # the slack channel runtime. So slack ships as a GitHub Release tarball exactly
      # like msteams, installed via `openclaw plugins install npm-pack:<url>` (slack
      # uses openKeyedStore → REQUIRES trustedOfficialInstall==true, so a bare-tarball
      # install would crash-loop the channel). slack asset contract — do NOT change:
      #   https://github.com/getboon/openclaw/releases/download/v<version>/openclaw-slack-<version>.tgz
      #   plus a sibling openclaw-slack-<version>.tgz.sha256.
      # extensions/slack/package.json version is pinned to the gateway version in
      # lockstep (`2026.6.11-boon.N`), same as msteams.
      - name: Pack slack plugin tarball + compute sha256
        id: slack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./extensions/slack/package.json').version")"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "FATAL: tag '${TAG}' does not match extensions/slack/package.json version 'v${version}' — bump slack in lockstep with the gateway" >&2
            exit 1
          fi
          tarball="openclaw-slack-${version}.tgz"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/slack
          OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
            node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/slack -- \
            npm pack --pack-destination "${GITHUB_WORKSPACE}"
          if [[ ! -f "${tarball}" ]]; then
            echo "FATAL: expected '${tarball}' on disk after slack pack; found:" >&2
            ls -1 ./openclaw-slack-*.tgz >&2 || true
            exit 1
          fi
          sha256sum "${tarball}" > "${tarball}.sha256"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}"
          cat "${tarball}.sha256"

      # Pack the fork-versioned @openclaw/diagnostics-prometheus plugin. Identical
      # machinery to the slack/msteams steps above. WHY the fork must publish it:
      # the plugin's dist is EXCLUDED from the published gateway package
      # (package.json `!dist/extensions/diagnostics-prometheus/**`), so a fleet host
      # has no way to run the Prometheus exporter unless the plugin is installed
      # separately — and gandalf-manager's Alloy scrape (job `boon-agent-openclaw`,
      # ENG-15788) has nothing to scrape until it is. So it ships as a GitHub Release
      # tarball exactly like slack/msteams, installed via
      # `openclaw plugins install npm-pack:<url>`. Unlike slack/msteams it does NOT
      # use openKeyedStore (verified: no trust-gate), so a bare install wouldn't
      # crash-loop — but we use the same npm-pack: trusted path for install-shape
      # consistency across the fork's plugins. asset contract:
      #   https://github.com/getboon/openclaw/releases/download/v<version>/openclaw-diagnostics-prometheus-<version>.tgz
      #   plus a sibling openclaw-diagnostics-prometheus-<version>.tgz.sha256.
      # extensions/diagnostics-prometheus/package.json version is pinned to the
      # gateway version in lockstep (`2026.6.11-boon.N`), same as slack/msteams.
      - name: Pack diagnostics-prometheus plugin tarball + compute sha256
        id: diagprom
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./extensions/diagnostics-prometheus/package.json').version")"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "FATAL: tag '${TAG}' does not match extensions/diagnostics-prometheus/package.json version 'v${version}' — bump diagnostics-prometheus in lockstep with the gateway" >&2
            exit 1
          fi
          tarball="openclaw-diagnostics-prometheus-${version}.tgz"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/diagnostics-prometheus
          OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
            node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/diagnostics-prometheus -- \
            npm pack --pack-destination "${GITHUB_WORKSPACE}"
          if [[ ! -f "${tarball}" ]]; then
            echo "FATAL: expected '${tarball}' on disk after diagnostics-prometheus pack; found:" >&2
            ls -1 ./openclaw-diagnostics-prometheus-*.tgz >&2 || true
            exit 1
          fi
          sha256sum "${tarball}" > "${tarball}.sha256"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}"
          cat "${tarball}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          MSTEAMS_TARBALL: ${{ steps.msteams.outputs.tarball }}
          SLACK_TARBALL: ${{ steps.slack.outputs.tarball }}
          DIAGPROM_TARBALL: ${{ steps.diagprom.outputs.tarball }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --clobber \
              "${TARBALL}" "${TARBALL}.sha256" \
              "${MSTEAMS_TARBALL}" "${MSTEAMS_TARBALL}.sha256" \
              "${SLACK_TARBALL}" "${SLACK_TARBALL}.sha256" \
              "${DIAGPROM_TARBALL}" "${DIAGPROM_TARBALL}.sha256"
          else
            gh release create "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "${RELEASE_TAG}" \
              --notes "Boon fork release ${RELEASE_TAG}. Install: \`npm i -g <asset-url>\`. Ships the gateway tarball + the fork-versioned @openclaw/msteams, @openclaw/slack, and @openclaw/diagnostics-prometheus plugin tarballs." \
              "${TARBALL}" "${TARBALL}.sha256" \
              "${MSTEAMS_TARBALL}" "${MSTEAMS_TARBALL}.sha256" \
              "${SLACK_TARBALL}" "${SLACK_TARBALL}.sha256" \
              "${DIAGPROM_TARBALL}" "${DIAGPROM_TARBALL}.sha256"
          fi
          echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
