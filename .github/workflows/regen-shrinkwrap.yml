name: Regen Shrinkwrap (one-shot)

# Temporary maintainer utility: regenerate npm-shrinkwrap.json on a CI-matching
# Linux runner so the committed shrinkwrap matches CI's npm resolution, then
# commit it back to the dispatched branch. Delete after the 6.6 migration lands.
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to regenerate shrinkwrap on and push back to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate shrinkwraps
        run: pnpm deps:shrinkwrap:generate
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- '**/npm-shrinkwrap.json' npm-shrinkwrap.json; then
            echo "npm-shrinkwrap.json already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '**/npm-shrinkwrap.json' npm-shrinkwrap.json
          git commit -m "build: regenerate npm-shrinkwrap.json on CI runner (deterministic resolution)"
          git push origin "HEAD:${{ inputs.target_branch }}"
