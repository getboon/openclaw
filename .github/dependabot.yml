---
# Dependabot config for getboon/openclaw (ENG-22470, epic ENG-22136). Same
# rules as getboon/boon (ENG-22137).
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Rules this file follows (scripts/dependabot/verify-dependabot-coverage
# enforces them in CI):
# - Every tracked lockfile / go.mod / Package.resolved / Gradle build has an
#   entry for its ecosystem. Add one when you add a new package directory.
#   The pnpm workspace is one npm entry at "/": Dependabot updates every
#   workspace package.json and pnpm-lock.yaml together. The npm-shrinkwrap.json
#   files are generated from pnpm-lock.yaml (scripts/generate-npm-shrinkwrap.mjs)
#   and need no entry of their own.
# - Every entry has a cooldown: version updates wait 5 days (14 for majors)
#   after a release, so a hijacked package version (the 2025 npm chalk/debug
#   and Shai-Hulud attacks) is usually pulled before we take it. Security
#   updates ignore the cooldown and arrive immediately. pnpm's own
#   minimumReleaseAge in pnpm-workspace.yaml is the same 5 days.
# - github-actions and docker support only cooldown.default-days; a
#   semver-*-days key on them makes Dependabot reject the WHOLE file.
# - Base-image (docker) bumps are owned by ENG-22139; the docker entry below is
#   kept as it was, only with the shared schedule and cooldown.
# - Dependabot does not rewrite pnpm `overrides` in pnpm-workspace.yaml. A
#   package pinned there only moves when someone bumps the override, so the
#   coverage checker also flags an override that pins a version with an open
#   Dependabot alert (run with --alerts).
# - open-pull-requests-limit is 7 per entry (not per directory). Majors open
#   one PR each and fill these slots, so the first weeks drain a backlog.
#   Security updates have their own fixed limit (10) and are not held back.
# - npm splits minor/patch bumps into production and development groups
#   (dependency-type), so a broken dev tool can't hold back app libraries in
#   the same PR. The other ecosystems don't distinguish the two, so they keep
#   one minor/patch group per entry.
# - Every entry runs Monday 06:00 UTC, so its PRs exist (and
#   dependabot-auto-merge has decided them) before dependabot-digest.yml posts
#   the week's Slack thread at 13:00 UTC.
# Safe patch/minor PRs are merged by .github/workflows/dependabot-auto-merge.yml.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # github-actions supports only default-days; a semver-*-days key here makes
    # Dependabot reject the whole file.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 7
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 7
    groups:
      npm-production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "swift"
    directories:
      - "/apps/macos"
      - "/apps/macos-mlx-tts"
      - "/apps/shared/OpenClawKit"
      - "/apps/swabble"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 7
    groups:
      swift-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      swift-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directories:
      - "/apps/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 7
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/scripts/docs-i18n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 7
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base images belong to ENG-22139; see the header.
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # docker supports only default-days, like github-actions.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 7
    groups:
      docker-images:
        applies-to: version-updates
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
